<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勤怠管理アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Helvetica', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 20px;
        }

        /* スタッフ選択セクション */
        .staff-selection {
            margin-bottom: 30px;
        }

        .staff-selection label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .staff-selection select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        /* ボタングループ */
        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }

        .btn-start {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-end {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
        }

        .btn-end:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .btn-end:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* 統計情報 */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        /* タブナビゲーション */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: #999;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        /* 勤怠記録 */
        .attendance-log {
            display: none;
        }

        .attendance-log.active {
            display: block;
        }

        .log-entry {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .log-entry.completed {
            border-left-color: #4CAF50;
        }

        .log-entry-staff {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .log-entry-times {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .log-entry-duration {
            font-size: 14px;
            font-weight: bold;
            color: #4CAF50;
        }

        .log-entry-duration.ongoing {
            color: #667eea;
        }

        .empty-message {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        /* 全スタッフ勤怠一覧 */
        .staff-list {
            display: none;
        }

        .staff-list.active {
            display: block;
        }

        .staff-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        .staff-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .staff-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .staff-status.working {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .staff-status.off {
            background: #ffcccc;
            color: #c62828;
        }

        .staff-times {
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
        }

        .staff-monthly {
            font-size: 14px;
            font-weight: bold;
            color: #667eea;
        }

        /* リセットボタン */
        .reset-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-reset:hover {
            background: #da190b;
        }

        /* モバイル対応 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 24px;
            }

            .btn {
                padding: 12px;
                font-size: 14px;
            }

            .stat-box {
                padding: 15px;
            }

            .stat-value {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 勤怠管理アプリ</h1>
            <p id="currentDate"></p>
        </div>

        <div class="content">
            <!-- スタッフ選択 -->
            <div class="staff-selection">
                <label for="staffSelect">スタッフを選択:</label>
                <select id="staffSelect">
                    <option value="">-- 選択してください --</option>
                </select>
            </div>

            <!-- ボタングループ -->
            <div class="button-group">
                <button class="btn btn-start" id="checkInBtn" disabled>出勤</button>
                <button class="btn btn-end" id="checkOutBtn" disabled>退勤</button>
            </div>

            <!-- 統計情報 -->
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">今日の勤務時間</div>
                    <div class="stat-value" id="todayHours">0時間0分</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">今月の勤務時間</div>
                    <div class="stat-value" id="monthlyHours">0時間0分</div>
                </div>
            </div>

            <!-- タブ -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="today-log">今日の記録</button>
                <button class="tab-btn" data-tab="staff-list">全スタッフ一覧</button>
            </div>

            <!-- 今日の勤怠記録 -->
            <div class="attendance-log active" id="today-log"></div>

            <!-- 全スタッフ勤怠一覧 -->
            <div class="staff-list" id="staff-list"></div>

            <!-- リセット -->
            <div class="reset-section">
                <button class="btn-reset" onclick="resetAllData()">全データをリセット</button>
            </div>
        </div>
    </div>

    <script>
        // ===== 定数とデータ管理 =====
        const STAFF_NAMES = [
            '店長', 'りり', 'ゆうな', 'せいや', 'たかや',
            'サノー', 'なるひと', 'ひな', 'その他①', 'その他②',
            'その他③', 'その他④', 'その他⑤', 'その他⑥', 'その他⑦'
        ];

        const STORAGE_KEY = 'attendanceData';

        // ===== データ構造 =====
        function getDefaultData() {
            return {
                records: {} // { staffName: [{ date, checkIn, checkOut }, ...] }
            };
        }

        // ===== ユーティリティ関数 =====
        function getData() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : getDefaultData();
        }

        function saveData(data) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function getCurrentDate() {
            const now = new Date();
            return now.toISOString().split('T')[0]; // YYYY-MM-DD
        }

        function getCurrentDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day} ${hours}:${minutes}`;
        }

        function formatDateTime(dateTimeStr) {
            return dateTimeStr; // Already formatted as HH:MM
        }

        function calculateDuration(checkInStr, checkOutStr) {
            const checkIn = new Date(`2000-01-01 ${checkInStr}`);
            const checkOut = new Date(`2000-01-01 ${checkOutStr}`);
            const diffMs = checkOut - checkIn;
            const diffMinutes = Math.round(diffMs / 60000);
            const hours = Math.floor(diffMinutes / 60);
            const minutes = diffMinutes % 60;
            return { hours, minutes };
        }

        function formatDuration(hours, minutes) {
            return `${hours}時間${minutes}分`;
        }

        function getTodayTotalHours(staffName) {
            const data = getData();
            const today = getCurrentDate();
            const records = data.records[staffName] || [];
            let totalMinutes = 0;

            records.forEach(record => {
                if (record.date === today && record.checkOut) {
                    const duration = calculateDuration(record.checkIn, record.checkOut);
                    totalMinutes += duration.hours * 60 + duration.minutes;
                }
            });

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return { hours, minutes };
        }

        function getMonthlyTotalHours(staffName) {
            const data = getData();
            const now = new Date();
            const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
            const records = data.records[staffName] || [];
            let totalMinutes = 0;

            records.forEach(record => {
                if (record.date.startsWith(currentMonth) && record.checkOut) {
                    const duration = calculateDuration(record.checkIn, record.checkOut);
                    totalMinutes += duration.hours * 60 + duration.minutes;
                }
            });

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            return { hours, minutes };
        }

        function isCheckedInToday(staffName) {
            const data = getData();
            const today = getCurrentDate();
            const records = data.records[staffName] || [];
            const todayRecord = records.find(r => r.date === today);
            return todayRecord && !todayRecord.checkOut;
        }

        // ===== UI更新関数 =====
        function initStaffSelect() {
            const select = document.getElementById('staffSelect');
            select.innerHTML = '<option value="">-- 選択してください --</option>';
            STAFF_NAMES.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
            });
        }

        function updateCurrentDate() {
            const dateElement = document.getElementById('currentDate');
            const now = new Date();
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            dateElement.textContent = now.toLocaleDateString('ja-JP', options);
        }

        function updateButtons() {
            const staffSelect = document.getElementById('staffSelect');
            const staffName = staffSelect.value;
            const checkInBtn = document.getElementById('checkInBtn');
            const checkOutBtn = document.getElementById('checkOutBtn');

            if (!staffName) {
                checkInBtn.disabled = true;
                checkOutBtn.disabled = true;
                return;
            }

            const checkedIn = isCheckedInToday(staffName);
            checkInBtn.disabled = checkedIn;
            checkOutBtn.disabled = !checkedIn;
        }

        function updateStats() {
            const staffSelect = document.getElementById('staffSelect');
            const staffName = staffSelect.value;

            if (!staffName) {
                document.getElementById('todayHours').textContent = '0時間0分';
                document.getElementById('monthlyHours').textContent = '0時間0分';
                return;
            }

            const today = getTodayTotalHours(staffName);
            const monthly = getMonthlyTotalHours(staffName);

            document.getElementById('todayHours').textContent = formatDuration(today.hours, today.minutes);
            document.getElementById('monthlyHours').textContent = formatDuration(monthly.hours, monthly.minutes);
        }

        function updateTodayLog() {
            const staffSelect = document.getElementById('staffSelect');
            const staffName = staffSelect.value;
            const logContainer = document.getElementById('today-log');

            if (!staffName) {
                logContainer.innerHTML = '<div class="empty-message">スタッフを選択してください</div>';
                return;
            }

            const data = getData();
            const today = getCurrentDate();
            const records = (data.records[staffName] || []).filter(r => r.date === today);

            if (records.length === 0) {
                logContainer.innerHTML = '<div class="empty-message">今日の記録はまだありません</div>';
                return;
            }

            logContainer.innerHTML = records.map(record => {
                const isCompleted = !!record.checkOut;
                const duration = isCompleted ? calculateDuration(record.checkIn, record.checkOut) : null;
                
                return `
                    <div class="log-entry ${isCompleted ? 'completed' : ''}">
                        <div class="log-entry-staff">${staffName}</div>
                        <div class="log-entry-times">
                            出勤: ${record.checkIn} ${record.checkOut ? `| 退勤: ${record.checkOut}` : '(勤務中)'}
                        </div>
                        ${isCompleted ? `<div class="log-entry-duration">${formatDuration(duration.hours, duration.minutes)}</div>` : `<div class="log-entry-duration ongoing">現在勤務中...</div>`}
                    </div>
                `;
            }).join('');
        }

        function updateStaffList() {
            const listContainer = document.getElementById('staff-list');
            const data = getData();
            const today = getCurrentDate();

            const staffHTML = STAFF_NAMES.map(staffName => {
                const records = data.records[staffName] || [];
                const todayRecord = records.find(r => r.date === today);
                const isWorking = todayRecord && !todayRecord.checkOut;

                const todayTotal = getTodayTotalHours(staffName);
                const monthlyTotal = getMonthlyTotalHours(staffName);

                let lastCheckIn = '-';
                if (todayRecord && todayRecord.checkIn) {
                    lastCheckIn = todayRecord.checkIn;
                }

                return `
                    <div class="staff-item">
                        <div class="staff-name">${staffName}</div>
                        <div class="staff-status ${isWorking ? 'working' : 'off'}">
                            ${isWorking ? '勤務中' : '未勤務'}
                        </div>
                        <div class="staff-times">
                            ${todayRecord ? `出勤: ${lastCheckIn}` : '本日: 未出勤'}
                        </div>
                        <div class="staff-monthly">
                            今日: ${formatDuration(todayTotal.hours, todayTotal.minutes)} | 今月: ${formatDuration(monthlyTotal.hours, monthlyTotal.minutes)}
                        </div>
                    </div>
                `;
            }).join('');

            listContainer.innerHTML = staffHTML;
        }

        function updateAllUI() {
            updateButtons();
            updateStats();
            updateTodayLog();
            updateStaffList();
        }

        // ===== イベントハンドラ =====
        document.getElementById('staffSelect').addEventListener('change', () => {
            updateAllUI();
        });

        document.getElementById('checkInBtn').addEventListener('click', () => {
            const staffName = document.getElementById('staffSelect').value;
            if (!staffName) return;

            const data = getData();
            if (!data.records[staffName]) {
                data.records[staffName] = [];
            }

            const today = getCurrentDate();
            const timeStr = getCurrentDateTime().split(' ')[1];

            data.records[staffName].push({
                date: today,
                checkIn: timeStr,
                checkOut: null
            });

            saveData(data);
            updateAllUI();
            alert(`${staffName}さんが出勤しました！ (${timeStr})`);
        });

        document.getElementById('checkOutBtn').addEventListener('click', () => {
            const staffName = document.getElementById('staffSelect').value;
            if (!staffName) return;

            const data = getData();
            const today = getCurrentDate();
            const records = data.records[staffName] || [];
            const todayRecord = records.reverse().find(r => r.date === today && !r.checkOut);

            if (todayRecord) {
                const timeStr = getCurrentDateTime().split(' ')[1];
                todayRecord.checkOut = timeStr;
                const duration = calculateDuration(todayRecord.checkIn, timeStr);
                saveData(data);
                updateAllUI();
                alert(`${staffName}さんが退勤しました！ (${timeStr})\n勤務時間: ${formatDuration(duration.hours, duration.minutes)}`);
            }
        });

        // タブ切り替え
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.attendance-log, .staff-list').forEach(el => el.classList.remove('active'));

                btn.classList.add('active');
                const tabId = btn.dataset.tab;
                document.getElementById(tabId).classList.add('active');
            });
        });

        // リセット関数
        function resetAllData() {
            if (confirm('全てのデータが削除されます。本当によろしいですか？')) {
                localStorage.removeItem(STORAGE_KEY);
                document.getElementById('staffSelect').value = '';
                updateAllUI();
                alert('全データがリセットされました。');
            }
        }

        // ===== 初期化 =====
        window.addEventListener('DOMContentLoaded', () => {
            updateCurrentDate();
            initStaffSelect();
            updateAllUI();
        });

        // ページがアクティブになるたびに更新
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                updateCurrentDate();
                updateAllUI();
            }
        });
    </script>
</body>
</html>
